name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - run: bun test
      - run: bun audit
      - run: bun run build
        env:
          # vite.config.js loads .env into process.env; the build itself
          # does not need real values.
          DATABASE_URL: postgres://hcai:hcai@localhost:55432/hcai
          OPENROUTER_API_KEY: ci
          TYPESAFE_API_KEY: ci

  integration:
    name: PostgreSQL + ClickHouse integration tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Unit files already ran in the `unit` job; only the Docker-gated
      # files run here. The script starts compose, creates and migrates
      # hcai_test, and sets the opt-in variables.
      - run: bun run test:integration $(find src -name "*.integration.test.ts")
        env:
          DATABASE_URL: postgres://hcai:hcai@localhost:55432/hcai
          OPENROUTER_API_KEY: ci
          TYPESAFE_API_KEY: ci
      - if: always()
        run: docker compose logs --no-color postgres clickhouse | tail -n 200
      - if: always()
        run: docker compose down --volumes
