name: CI

on:
  push:
    branches: [main, neo]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, tests, build
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@v4
      # Bring them up in the background so pulling and booting overlap with
      # install, typecheck and check; the step before bun test waits for it.
      - run: nohup sh -c 'docker compose up -d --wait; echo $? > "$RUNNER_TEMP/compose-exit"' > "$RUNNER_TEMP/compose.log" 2>&1 &
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - run: |
          while [ ! -f "$RUNNER_TEMP/compose-exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/compose.log"
          exit "$(cat "$RUNNER_TEMP/compose-exit")"
      - run: bun test
      # deepmerge has no patched release; it only merges vite-plugin-svelte's own config.
      - run: bun audit --ignore GHSA-gcqx-w48m-w2h4
      - run: bun run build
        env:
          DATABASE_URL: postgres://hcai:hcai@localhost:55432/hcai
          OPENROUTER_API_KEY: ci
          TYPESAFE_API_KEY: ci
      - if: failure()
        run: docker compose logs --no-color postgres clickhouse garage | tail -n 200
      - if: always()
        run: docker compose down --volumes
